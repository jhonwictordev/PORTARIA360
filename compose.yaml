services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: portaria360
      POSTGRES_USER: portaria360
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5432:5432"
    volumes:
      - portaria360-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portaria360 -d portaria360"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  portaria360-postgres:
